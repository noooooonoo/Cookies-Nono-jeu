<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍪 Cookie Clicker - Addictif!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            max-height: 900px;
        }

        /* ZONE DE JEU PRINCIPALE */
        .game-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .stats-top {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 40px;
            gap: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            flex: 1;
            backdrop-filter: blur(5px);
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #ffd700;
        }

        /* COOKIE GÉANT AU CENTRE */
        .cookie-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 30px 0;
            cursor: pointer;
        }

        .cookie-btn {
            position: absolute;
            width: 100%;
            height: 100%;
            border: none;
            background: none;
            cursor: pointer;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
            transition: transform 0.1s;
            border-radius: 50%;
        }

        .cookie-btn:active {
            transform: scale(0.92);
        }

        .cookie-btn:hover {
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.4));
        }

        /* SVG Cookie */
        .cookie-svg {
            width: 100%;
            height: 100%;
        }

        /* Animation du cookie */
        @keyframes cookiePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .cookie-btn {
            animation: cookiePulse 2s ease-in-out infinite;
        }

        /* FLOATING NUMBERS */
        .click-number {
            position: fixed;
            font-weight: bold;
            font-size: 1.5em;
            pointer-events: none;
            z-index: 1000;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            animation: floatUp 1.5s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5);
            }
        }

        /* PANNEAUX LATÉRAUX */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .sidebar-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* UPGRADES */
        .upgrade-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upgrade-item:hover:not(.disabled) {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
            border-color: rgba(255, 215, 0, 0.5);
        }

        .upgrade-item.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .upgrade-name {
            font-weight: bold;
            font-size: 0.85em;
            margin-bottom: 3px;
        }

        .upgrade-bonus {
            font-size: 0.75em;
            opacity: 0.8;
            color: #a0ff00;
            margin-bottom: 3px;
        }

        .upgrade-cost {
            font-size: 0.75em;
            color: #ffd700;
        }

        /* COMBO DISPLAY */
        .combo-display {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            color: #ff6b6b;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .combo-display.active {
            opacity: 1;
            animation: comboFlash 0.3s;
        }

        @keyframes comboFlash {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* ACHIEVEMENTS */
        .achievement {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            animation: achievementSlide 0.5s ease-out;
            z-index: 10000;
            max-width: 300px;
        }

        @keyframes achievementSlide {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .achievement-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .achievement-desc {
            font-size: 0.9em;
            opacity: 0.9;
        }

        /* RESPONSIF */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .sidebar {
                max-height: 300px;
            }

            .stats-top {
                flex-wrap: wrap;
            }

            .stat-box {
                flex: 1 1 45%;
            }
        }

        /* Scrollbar personnalisée */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .multiplier-badge {
            display: inline-block;
            background: #ff6b6b;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-zone">
            <div class="stats-top">
                <div class="stat-box">
                    <div class="stat-label">🍪 Total</div>
                    <div class="stat-value" id="cookie-count">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">⚡ Par Sec</div>
                    <div class="stat-value" id="cps-display">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">🔥 Combo</div>
                    <div class="stat-value" id="combo-count">0x</div>
                </div>
            </div>

            <div class="cookie-container">
                <button class="cookie-btn" id="click-button">
                    <svg class="cookie-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <!-- Cookie extérieur -->
                        <circle cx="100" cy="100" r="95" fill="#8B4513" filter="url(#shadow)"/>
                        <!-- Cookie intérieur -->
                        <circle cx="100" cy="100" r="85" fill="#D2B48C"/>
                        <!-- Pépites de chocolat -->
                        <circle cx="70" cy="70" r="12" fill="#654321"/>
                        <circle cx="130" cy="75" r="14" fill="#654321"/>
                        <circle cx="60" cy="120" r="11" fill="#654321"/>
                        <circle cx="140" cy="130" r="13" fill="#654321"/>
                        <circle cx="100" cy="100" r="15" fill="#654321"/>
                        <circle cx="110" cy="60" r="12" fill="#654321"/>
                        <circle cx="75" cy="145" r="10" fill="#654321"/>
                        <circle cx="140" cy="70" r="11" fill="#654321"/>
                        <circle cx="65" cy="75" r="9" fill="#654321"/>
                        <defs>
                            <filter id="shadow">
                                <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/>
                            </filter>
                        </defs>
                    </svg>
                </button>
            </div>

            <div class="combo-display" id="combo-display">
                🔥 Combo x<span id="combo-multiplier">0</span>!
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-section">
                <div class="section-title">⚙️ Générateurs</div>
                <div id="generators-list"></div>
            </div>

            <div class="sidebar-section">
                <div class="section-title">✨ Améliorations</div>
                <div id="upgrades-list"></div>
            </div>

            <div class="sidebar-section">
                <div class="section-title">🏆 Stats</div>
                <div style="font-size: 0.9em; line-height: 1.8;">
                    <div>Clics: <span id="total-clicks" style="color: #ffd700;">0</span></div>
                    <div>Meilleur combo: <span id="best-combo" style="color: #ff6b6b;">0x</span></div>
                    <div>Gagné par clic: <span id="click-value" style="color: #a0ff00;">1</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game State
        const game = {
            cookies: 0,
            clickValue: 1,
            cps: 0,
            combo: 0,
            bestCombo: 0,
            totalClicks: 0,
            lastClickTime: 0,
            comboTimeout: null,
            achievements: [],

            generators: [
                { id: 'auto-clicker', name: 'Souris 🖱️', cost: 10, owned: 0, cps: 1, baseCost: 10 },
                { id: 'farm', name: 'Ferme 🌾', cost: 100, owned: 0, cps: 5, baseCost: 100 },
                { id: 'factory', name: 'Usine 🏭', cost: 500, owned: 0, cps: 20, baseCost: 500 },
                { id: 'bakery', name: 'Boulangerie 🥐', cost: 2000, owned: 0, cps: 50, baseCost: 2000 },
                { id: 'robot', name: 'Robot 🤖', cost: 10000, owned: 0, cps: 100, baseCost: 10000 },
            ],

            upgrades: [
                { id: 'double-click', name: '+1 Clic', cost: 50, owned: 0, bonus: 1, baseCost: 50 },
                { id: 'triple-click', name: '+2 Clic', cost: 200, owned: 0, bonus: 2, baseCost: 200 },
                { id: 'mega-click', name: '+5 Clic', cost: 1000, owned: 0, bonus: 5, baseCost: 1000 },
                { id: 'power-click', name: '+10 Clic', cost: 5000, owned: 0, bonus: 10, baseCost: 5000 },
            ]
        };

        // Éléments du DOM
        const clickBtn = document.getElementById('click-button');
        const cookieCountEl = document.getElementById('cookie-count');
        const cpsDisplayEl = document.getElementById('cps-display');
        const comboCountEl = document.getElementById('combo-count');
        const comboDisplayEl = document.getElementById('combo-display');
        const comboMultiplierEl = document.getElementById('combo-multiplier');
        const totalClicksEl = document.getElementById('total-clicks');
        const bestComboEl = document.getElementById('best-combo');
        const clickValueEl = document.getElementById('click-value');
        const generatorsListEl = document.getElementById('generators-list');
        const upgradesListEl = document.getElementById('upgrades-list');

        // Fonction de clic principale
        function handleClick(e) {
            const now = Date.now();
            const timeSinceLastClick = now - game.lastClickTime;

            // Gérer le combo
            if (timeSinceLastClick < 500) { // 500ms = combo timeout
                game.combo++;
            } else {
                game.combo = 1;
            }

            game.lastClickTime = now;
            game.totalClicks++;

            // Calculer les cookies gagnés
            const cookiesGained = game.clickValue * game.combo;
            game.cookies += cookiesGained;

            // Afficher le nombre
            showClickNumber(e, cookiesGained, game.combo);

            // Mettre à jour le combo display
            updateComboDisplay();

            // Tracker le meilleur combo
            if (game.combo > game.bestCombo) {
                game.bestCombo = game.combo;
                triggerAchievement('🔥 Nouveau Record', `Combo x${game.bestCombo}!`);
            }

            // Réinitialiser le combo après 500ms
            clearTimeout(game.comboTimeout);
            game.comboTimeout = setTimeout(() => {
                game.combo = 0;
                comboDisplayEl.classList.remove('active');
            }, 500);

            updateUI();
            checkAchievements();
        }

        // Afficher le nombre flottant
        function showClickNumber(e, amount, combo) {
            const span = document.createElement('div');
            span.className = 'click-number';
            span.textContent = `+${amount}` + (combo > 1 ? ` x${combo}` : '');

            // Couleur basée sur le combo
            if (combo > 3) {
                span.style.color = '#ff6b6b';
                span.textContent += ' 🔥';
            } else if (combo > 1) {
                span.style.color = '#ffd700';
            } else {
                span.style.color = '#a0ff00';
            }

            span.style.left = e.clientX + 'px';
            span.style.top = e.clientY + 'px';

            document.body.appendChild(span);
            setTimeout(() => span.remove(), 1500);
        }

        // Mettre à jour le combo display
        function updateComboDisplay() {
            if (game.combo > 1) {
                comboDisplayEl.classList.add('active');
                comboMultiplierEl.textContent = game.combo;
            }
        }

        // Mettre à jour l'interface
        function updateUI() {
            cookieCountEl.textContent = formatNumber(game.cookies);
            cpsDisplayEl.textContent = formatNumber(game.cps);
            comboCountEl.textContent = game.combo + 'x';
            totalClicksEl.textContent = game.totalClicks;
            bestComboEl.textContent = game.bestCombo + 'x';
            clickValueEl.textContent = game.clickValue;

            updateGenerators();
            updateUpgrades();
        }

        // Acheter un générateur
        function buyGenerator(index) {
            const gen = game.generators[index];
            if (game.cookies >= gen.cost) {
                game.cookies -= gen.cost;
                gen.owned++;
                gen.cost = Math.ceil(gen.baseCost * Math.pow(1.15, gen.owned));
                game.cps += gen.cps;

                triggerAchievement('🎉 Nouvel Achat', `Vous avez acheté: ${gen.name}`);
                updateUI();
                saveGame();
            }
        }

        // Acheter une amélioration
        function buyUpgrade(index) {
            const upg = game.upgrades[index];
            if (game.cookies >= upg.cost) {
                game.cookies -= upg.cost;
                upg.owned++;
                game.clickValue += upg.bonus;
                upg.cost = Math.ceil(upg.baseCost * Math.pow(1.2, upg.owned));

                triggerAchievement('⚡ Amélioration', `Clic augmenté de +${upg.bonus}!`);
                updateUI();
                saveGame();
            }
        }

        // Afficher les générateurs
        function updateGenerators() {
            generatorsListEl.innerHTML = game.generators.map((gen, idx) => {
                const canBuy = game.cookies >= gen.cost;
                return `
                    <div class="upgrade-item ${canBuy ? '' : 'disabled'}" onclick="buyGenerator(${idx})">
                        <div class="upgrade-name">${gen.name}</div>
                        <div class="upgrade-bonus">+${gen.cps}/s</div>
                        <div class="upgrade-bonus">Possédé: ${gen.owned}</div>
                        <div class="upgrade-cost">💰 ${formatNumber(gen.cost)}</div>
                    </div>
                `;
            }).join('');
        }

        // Afficher les améliorations
        function updateUpgrades() {
            upgradesListEl.innerHTML = game.upgrades.map((upg, idx) => {
                const canBuy = game.cookies >= upg.cost;
                return `
                    <div class="upgrade-item ${canBuy ? '' : 'disabled'}" onclick="buyUpgrade(${idx})">
                        <div class="upgrade-name">${upg.name}</div>
                        <div class="upgrade-bonus">+${upg.bonus} par clic</div>
                        <div class="upgrade-bonus">Possédé: ${upg.owned}</div>
                        <div class="upgrade-cost">💰 ${formatNumber(upg.cost)}</div>
                    </div>
                `;
            }).join('');
        }

        // Génération passive
        function passiveGeneration() {
            game.cookies += game.cps / 10;
            updateUI();
        }

        // Déclencher un achievement
        function triggerAchievement(title, desc) {
            const ach = document.createElement('div');
            ach.className = 'achievement';
            ach.innerHTML = `
                <div class="achievement-title">${title}</div>
                <div class="achievement-desc">${desc}</div>
            `;
            document.body.appendChild(ach);

            setTimeout(() => ach.remove(), 3000);
        }

        // Vérifier les achievements
        function checkAchievements() {
            if (game.totalClicks === 10) triggerAchievement('🎯 Premiers Clics', 'Vous avez cliqué 10 fois!');
            if (game.totalClicks === 100) triggerAchievement('💯 Centenaire', 'Vous avez cliqué 100 fois!');
            if (game.cookies > 1000) triggerAchievement('💰 Millionnaire', 'Vous avez 1000+ cookies!');
            if (game.clickValue >= 50) triggerAchievement('⚡ Super Clic', 'Votre clic vaut 50+ cookies!');
        }

        // Formater les nombres
        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
            return Math.floor(num).toString();
        }

        // Sauvegarder
        function saveGame() {
            localStorage.setItem('cookieGame', JSON.stringify(game));
        }

        // Charger
        function loadGame() {
            const saved = localStorage.getItem('cookieGame');
            if (saved) {
                const loaded = JSON.parse(saved);
                Object.assign(game, loaded);
            }
        }

        // Initialisation
        clickBtn.addEventListener('click', handleClick);
        setInterval(passiveGeneration, 100);
        setInterval(saveGame, 5000);

        loadGame();
        updateUI();

        triggerAchievement('🎮 Bienvenue!', 'Commencez à cliquer sur le cookie!');
    </script>
</body>
</html>
